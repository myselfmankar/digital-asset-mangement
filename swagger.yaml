openapi: 3.0.0
info:
  title: pyPhotoView API
  description: API for managing and retrieving photos and their metadata.
  version: 1.0.0
paths:
  /api/v1/images:
    get:
      summary: Read Images
      operationId: read_images_api_v1_images_get
      parameters:
        - name: skip
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Image'
    post:
      summary: Upload Image
      operationId: upload_image_api_v1_images_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: File with this name already exists.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Failed to process and save image.
  /api/v1/albums:
    get:
      summary: Read Albums
      operationId: read_albums_api_v1_albums_get
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
        - name: month
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Image'
  /api/v1/map-data:
    get:
      summary: Read Map Data
      operationId: read_map_data_api_v1_map_data_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Image'
components:
  schemas:
    Location:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
        city:
          type: string
        country:
          type: string
        state:
          type: string
        id:
          type: integer
      required:
        - latitude
        - longitude
        - id
    Metadata:
      type: object
      properties:
        camera_model:
          type: string
        date_taken:
          type: string
          format: date-time
        raw_exif:
          type: object
        id:
          type: integer
        location:
          $ref: '#/components/schemas/Location'
      required:
        - id
    Tag:
      type: object
      properties:
        name:
          type: string
        id:
          type: integer
      required:
        - name
        - id
    Image:
      type: object
      properties:
        filename:
          type: string
        filepath:
          type: string
        upload_date:
          type: string
          format: date-time
        resolution:
          type: string
        image_size:
          type: integer
        id:
          type: integer
        details:
          $ref: '#/components/schemas/Metadata'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
      required:
        - filename
        - filepath
        - upload_date
        - resolution
        - image_size
        - id
