services:
  db:
    image: postgres:16-alpine
    container_name: photoview-db
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photoview-backend
    volumes:
      - ./api:/app/api
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      API_BASE_URL: http://backend:8000/api/v1 # For inter-service communication
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"] # Health check on root path
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: photoview-frontend
    ports:
      - "8080:8000" # Map host port 8080 to container port 8000 (Python http.server default)
    depends_on:
      - backend # Frontend depends on backend to be available
    environment:
      API_BASE_URL: http://backend:8000/api/v1 # This is for the frontend to know where the backend is

volumes:
  db_data:
