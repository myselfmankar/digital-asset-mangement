services:
  db:
    image: postgres:16-alpine
    container_name: photoview-db
    environment:
      POSTGRES_DB: photoview
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: photoview-backend
    command: bash -c "uvicorn api.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./static:/app/static
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db/photoview
    depends_on:
      - db
    restart: on-failure

volumes:
  db_data:
